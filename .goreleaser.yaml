version: 2
project_name: ta

builds:
  - main: ./cmd/ta
    binary: ta
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/mo1ein/TelegramArchive/consts.Version={{.Version}}
        -X github.com/mo1ein/TelegramArchive/consts.Commit={{.Commit}}
        -X github.com/mo1ein/TelegramArchive/consts.CommitDate={{.CommitDate}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - licenses/*

checksum:
  name_template: checksums.txt

changelog:
  disable: true
