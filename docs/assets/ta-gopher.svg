    <path d="m172 133 196-97-132 80 3 38 29-20" fill="#b4e5f6"/>
    <path d="m236 116 60 36 72-116" fill="#e3f5ff"/>
    <path d="m172 133 23-13m102-18 35-34" fill="none" stroke="#fff" stroke-width="5"/>
    </g>
    <!-- Almost matching eyes; just enough of a puzzled stare. -->
    <ellipse cx="207" cy="199" rx="43" ry="48" fill="#fff"/>
    <ellipse cx="302" cy="197" rx="43" ry="48" fill="#fff"/>
    <ellipse cx="217" cy="205" rx="15" ry="19" fill="#27465a" stroke="none"/>
    <ellipse cx="293" cy="202" rx="15" ry="19" fill="#27465a" stroke="none"/>
    <circle cx="222" cy="198" r="6" fill="#fff" stroke="none"/>
    <circle cx="298" cy="195" r="6" fill="#fff" stroke="none"/>
