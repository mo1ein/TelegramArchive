<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ta: the happily clueless backup gopher</title>
  <desc id="description">A round, rosy-cheeked blue gopher with a little crooked paper-plane hat hugs a warm yellow archive box. Its gentle, slightly cross-eyed expression and two small teeth make it look cheerfully clueless. The box says ta.</desc>
  <metadata>Original SVG adaptation for ta, modified 2026-11-08. Inspired by the Go gopher by Renee French: https://go.dev/blog/gopher . This SVG is licensed under Creative Commons Attribution 4.0: https://creativecommons.org/licenses/by/4.0/ .</metadata>
  <g stroke="#27465a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m411 141 4-9 4 9 10 4-10 4-4 9-4-9-10-4Z" fill="#ffe3a1" stroke-width="3"/>
    <ellipse cx="258" cy="465" rx="160" ry="15" fill="#27465a" opacity=".1" stroke="none"/>
    <!-- Small feet tucked under a very important box. -->
    <path d="M167 410c-31-3-55 15-47 32 8 16 61 8 77-7m140-18c34-4 58 11 51 28-8 17-57 4-72-8" fill="#f2cbb4"/>
    <!-- Round ears and a soft silhouette. -->
    <circle cx="141" cy="160" r="37" fill="#79d3de"/>
    <circle cx="141" cy="160" r="17" fill="#46b2c6" stroke="none"/>
    <circle cx="361" cy="150" r="34" fill="#79d3de"/>
    <circle cx="361" cy="150" r="15" fill="#46b2c6" stroke="none"/>
