    <ellipse cx="172" cy="247" rx="16" ry="9" fill="#f6b4b9" opacity=".65" stroke="none"/>
    <ellipse cx="338" cy="245" rx="16" ry="9" fill="#f6b4b9" opacity=".65" stroke="none"/>
    <ellipse cx="255" cy="254" rx="36" ry="25" fill="#ffe2bd" stroke="none"/>
